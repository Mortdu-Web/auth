[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-client"
version = "0.1.0"
description = "Décorateur Flask pour vérifier l'accès via le service auth (Keycloak)"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0", "requests>=2.31"]

[tool.setuptools]
packages = ["auth_client"]
