services:
  auth:
    build: .
    container_name: auth
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen('http://localhost:' + os.getenv('PORT', '5000') + os.getenv('URL_PREFIX', '') + '/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
    external: true